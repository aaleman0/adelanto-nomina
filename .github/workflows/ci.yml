name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Cancela ejecuciones anteriores de la misma rama: no tiene sentido validar un
# commit que ya fue reemplazado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  quality:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitarios
        # `pnpm test` arranca vitest en modo watch y colgaría el runner.
        run: pnpm test:unit

      - name: Build
        # Valores ficticios: el build no se conecta a ningún servicio, pero
        # algunos módulos leen las variables al importarse.
        env:
          SUPABASE_URL: https://ci.supabase.co/rest/v1/
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_APP_URL: https://ci.example.com
        run: pnpm build

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks necesita el historial completo para escanear commits.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        # Solo falla ante vulnerabilidades altas o críticas, para que el
        # pipeline no se bloquee por avisos de severidad baja.
        run: pnpm audit --audit-level high

  db-types:
    name: Tipos de base de datos al día
    runs-on: ubuntu-latest
    # Solo corre si el repositorio tiene configuradas las credenciales de
    # Supabase. Sin ellas el paso se omite en vez de fallar.
    if: ${{ vars.SUPABASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar deriva de tipos
        # Falla si el esquema real difiere de src/types/database.types.ts.
        # Es lo que impide que un cambio de esquema pase inadvertido, porque
        # los tipos se mantienen a mano y el compilador no lo detecta.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: pnpm db:types:check
